services:
  postgres:
    image: postgres:17-alpine
    container_name: a2ui-postgres
    environment:
      POSTGRES_USER: a2ui
      POSTGRES_PASSWORD: a2ui_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2ui -d a2ui_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 会话内存子系统 / 多级缓存 的底层存储
  # 用途：session:{sid}:meta|working_memory|entity_store|trace
  #       cache:l1:*  cache:l2:*  cache:l4:*
  redis:
    image: redis:7-alpine
    container_name: a2ui-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

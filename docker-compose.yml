version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: a2ui-postgres
    environment:
      POSTGRES_USER: a2ui
      POSTGRES_PASSWORD: a2ui_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2ui -d a2ui_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: a2ui-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: a2ui-server/Dockerfile
    container_name: a2ui-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL_CORE=postgresql://a2ui:a2ui_password@postgres:5432/a2ui_core
      - DATABASE_URL_FOOD=postgresql://a2ui:a2ui_password@postgres:5432/a2ui_food
      - DATABASE_URL_CAMPUS=postgresql://a2ui:a2ui_password@postgres:5432/a2ui_campus
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

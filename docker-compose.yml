version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: a2ui-postgres
    environment:
      POSTGRES_USER: a2ui
      POSTGRES_PASSWORD: a2ui_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2ui -d a2ui_core"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
